[package]
name = "llm-watch"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Watch Codex and Claude sessions across SSH-accessible devboxes"
license = "MIT"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.5", features = ["derive"] }
fs2 = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shell-words = "1.1.1"
uuid = { version = "1.24.0", features = ["v4", "v5"] }
wait-timeout = "0.2.1"

[profile.release]
strip = true
lto = "thin"
