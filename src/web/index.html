<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>llm-watch</title>
<style>
  :root {
    color-scheme: light;
    --plane: #f9f9f7;
    --surface: #fcfcfb;
    --surface-sunken: #f2f1ed;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --ink-muted: #898781;
    --hairline: rgba(11, 11, 11, 0.10);
    --rule: #e1e0d9;
    --accent: #2a78d6;
    --good: #0ca30c;
    --warning: #fab219;
    --serious: #ec835a;
    --critical: #d03b3b;
    --shadow: 0 1px 2px rgba(11, 11, 11, 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --plane: #0d0d0d;
      --surface: #1a1a19;
      --surface-sunken: #232322;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --ink-muted: #898781;
      --hairline: rgba(255, 255, 255, 0.10);
      --rule: #2c2c2a;
      --accent: #3987e5;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --plane: #0d0d0d;
    --surface: #1a1a19;
    --surface-sunken: #232322;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --ink-muted: #898781;
    --hairline: rgba(255, 255, 255, 0.10);
    --rule: #2c2c2a;
    --accent: #3987e5;
    --shadow: none;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--plane);
    color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 64px; }

  /* ---- header ---------------------------------------------------- */
  header {
    display: flex; flex-wrap: wrap; gap: 16px;
    align-items: baseline; justify-content: space-between;
    padding-bottom: 16px; margin-bottom: 24px;
    border-bottom: 1px solid var(--rule);
  }
  h1 { font-size: 19px; font-weight: 620; margin: 0; letter-spacing: -0.01em; }
  h1 span { color: var(--ink-muted); font-weight: 400; }
  .meta { display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--ink-2); }

  .link {
    display: inline-flex; align-items: center; gap: 6px;
    font: inherit; font-size: 13px; color: var(--ink-2);
    background: none; border: 0; padding: 4px 6px; margin: -4px -6px;
    border-radius: 6px; cursor: pointer;
  }
  .link:hover { background: var(--surface-sunken); color: var(--ink); }
  .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .icon-button {
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; padding: 0; margin: -4px -4px -4px 0;
    border: 0; border-radius: 7px; background: none; cursor: pointer;
    color: var(--ink-muted);
  }
  .icon-button:hover { background: var(--surface-sunken); color: var(--ink); }
  .icon-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .icon-button[aria-pressed="true"] { color: var(--warning); }
  .icon-button[aria-pressed="true"]:hover { color: var(--warning); background: color-mix(in srgb, var(--warning) 14%, transparent); }
  .icon-button:disabled { opacity: 0.35; cursor: default; }
  .icon-button:disabled:hover { background: none; color: var(--ink-muted); }
  .icon-button svg { display: block; width: 17px; height: 17px; }
  .icon-button .rays { opacity: 0; }
  .icon-button[aria-pressed="true"] .rays { opacity: 1; }

  .conn { display: inline-flex; align-items: center; gap: 7px; font-variant-numeric: tabular-nums; }
  .conn::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%;
    background: var(--good); flex: none;
  }
  .conn[data-live="false"]::before { background: var(--critical); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.25; } }

  /* ---- summary tiles ---------------------------------------------- */
  .tiles {
    display: grid; gap: 12px; margin-bottom: 28px;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  }
  .tile {
    background: var(--surface); border: 1px solid var(--hairline);
    border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow);
  }
  .tile .label {
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; font-weight: 560; letter-spacing: 0.02em;
    text-transform: uppercase; color: var(--ink-2);
  }
  .tile .value { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; margin-top: 6px; }
  .tile[data-zero="true"] .value { color: var(--ink-muted); font-weight: 500; }

  /* ---- state badges ------------------------------------------------ */
  .badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; border-radius: 50%; flex: none;
    font-size: 10px; font-weight: 700; line-height: 1; color: #ffffff;
  }
  .badge[data-state="ready"]       { background: var(--good); }
  .badge[data-state="approval"]    { background: var(--warning); color: #3a2800; }
  .badge[data-state="error"]       { background: var(--critical); }
  .badge[data-state="running"]     { background: var(--accent); }
  .badge[data-state="idle"]        { background: var(--ink-muted); }
  .badge[data-state="stopped"]     { background: transparent; color: var(--ink-muted); box-shadow: inset 0 0 0 1.5px var(--ink-muted); }
  .badge[data-state="unreachable"] { background: var(--serious); color: #3a1600; }

  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase;
    white-space: nowrap;
  }

  /* ---- host cards --------------------------------------------------- */
  .hosts { display: flex; flex-direction: column; gap: 16px; }
  .host {
    background: var(--surface); border: 1px solid var(--hairline);
    border-radius: 12px; box-shadow: var(--shadow); overflow: hidden;
  }
  .host[data-reachable="false"] { border-color: color-mix(in srgb, var(--serious) 45%, var(--hairline)); }
  .host-head {
    display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
    padding: 12px 16px; border-bottom: 1px solid var(--rule);
  }
  .host-name { font-size: 15px; font-weight: 620; letter-spacing: -0.01em; }
  .host-verdict { font-size: 11.5px; }
  .host-verdict[data-state="running"] { color: var(--accent); }
  .host-verdict[data-state="idle"] { color: var(--ink-muted); }
  .host[data-working="true"] { border-color: color-mix(in srgb, var(--accent) 40%, var(--hairline)); }

  .label-chip, .label-input {
    font: inherit; font-size: 12.5px; line-height: 1.3;
    padding: 3px 9px; border-radius: 999px;
    border: 1px dashed var(--rule); background: transparent; color: var(--ink-2);
    max-width: 240px;
  }
  .label-chip {
    cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    border-style: solid; background: var(--surface-sunken);
  }
  .label-chip[data-empty="true"] {
    border-style: dashed; background: transparent; color: var(--ink-muted);
  }
  .label-chip:hover { color: var(--ink); border-color: var(--ink-muted); }
  .label-chip:focus-visible, .label-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .label-input { color: var(--ink); background: var(--surface); min-width: 160px; }
  .label-input.wide { min-width: 250px; max-width: 320px; }

  /* ---- attached pull requests --------------------------------------- */
  /* A chip is a real link: GitHub refuses to be framed, so these leave the
     dashboard rather than opening in the served-page viewer. */
  .pr-chip {
    display: inline-flex; align-items: center; max-width: 240px;
    font-size: 12.5px; line-height: 1.3;
    border: 1px solid var(--hairline); border-radius: 999px;
    background: var(--surface-sunken);
  }
  .pr-chip a {
    padding: 3px 4px 3px 10px; color: var(--ink-2); text-decoration: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pr-chip a:hover { color: var(--accent); }
  .pr-chip .pr-repo { color: var(--ink-muted); }
  .pr-drop {
    font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
    padding: 3px 8px 4px 4px; border: 0; border-radius: 999px;
    background: none; color: var(--ink-muted);
  }
  .pr-drop:hover { color: var(--critical); }
  .pr-chip a:focus-visible, .pr-drop:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .host-head .spacer { flex: 1 1 auto; }
  .host-note { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .host-note.warn { color: var(--serious); }
  .counts { display: flex; gap: 10px; }
  .count {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums;
  }

  /* ---- session rows -------------------------------------------------- */
  .run {
    display: grid; gap: 4px 14px; align-items: baseline;
    grid-template-columns: 108px minmax(0, 1fr) auto 20px;
    padding: 11px 16px;
  }
  .run + .run { border-top: 1px solid var(--rule); }
  .run[data-state="stopped"] { opacity: 0.55; }
  .run-state { grid-column: 1; }
  .run-state[data-state="ready"]    { color: var(--good); }
  .run-state[data-state="approval"] { color: color-mix(in srgb, var(--warning) 80%, var(--ink)); }
  .run-state[data-state="error"]    { color: var(--critical); }
  .run-state[data-state="running"]  { color: var(--accent); }
  .run-state[data-state="idle"]     { color: var(--ink-2); }
  .run-state[data-state="stopped"]  { color: var(--ink-muted); }
  .run-main { grid-column: 2; min-width: 0; }
  .run-task {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .run-task.empty { color: var(--ink-muted); }
  .run-sub {
    display: flex; flex-wrap: wrap; gap: 4px 8px;
    margin-top: 2px; font-size: 12.5px; color: var(--ink-2);
  }
  .run-sub .sep { color: var(--rule); }
  .tag {
    font-size: 11.5px; font-weight: 600; letter-spacing: 0.02em;
    text-transform: uppercase; color: var(--ink-2);
    background: var(--surface-sunken); border-radius: 4px; padding: 1px 5px;
  }
  .run-message {
    margin-top: 6px; padding-left: 9px;
    border-left: 2px solid var(--rule);
    font-size: 13px; color: var(--ink-2);
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3;
    line-clamp: 3; overflow: hidden;
  }
  .run-age {
    grid-column: 3; font-size: 12.5px; color: var(--ink-muted);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }

  /* A settled row you have read and no longer want on screen. The slot is held
     open on every row so ages stay in one column whether or not it is there. */
  .run-dismiss { grid-column: 4; align-self: start; }
  .run-drop {
    display: block; width: 20px; height: 20px; padding: 0;
    font: inherit; font-size: 14px; line-height: 1; cursor: pointer;
    border: 0; border-radius: 5px; background: none; color: var(--ink-muted);
    opacity: 0; transition: opacity 80ms ease-out;
  }
  .run:hover .run-drop, .run-drop:focus-visible { opacity: 1; }
  .run-drop:hover { color: var(--critical); background: var(--surface-sunken); }
  .run-drop:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  /* Nothing hovers on a touch screen, so the button is simply always there. */
  @media (hover: none) { .run-drop { opacity: 1; } }

  .count-restore {
    font: inherit; font-size: 12.5px; color: var(--ink-muted);
    background: none; border: 0; padding: 0; cursor: pointer;
    text-decoration: underline dotted; text-underline-offset: 2px;
  }
  .count-restore:hover { color: var(--ink); }
  .count-restore:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .empty-row { padding: 14px 16px; font-size: 13.5px; color: var(--ink-muted); }
  .error-row {
    padding: 12px 16px; font-size: 13.5px; color: var(--ink-2);
    background: color-mix(in srgb, var(--serious) 8%, transparent);
  }
  .error-row code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }

  footer { margin-top: 28px; font-size: 12.5px; color: var(--ink-muted); }

  /* ---- served-page links --------------------------------------------- */
  .link-button {
    display: inline-flex; align-items: center; gap: 6px;
    font: inherit; font-size: 12.5px; line-height: 1.3;
    padding: 3px 10px; border-radius: 999px; cursor: pointer;
    border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--hairline));
    background: color-mix(in srgb, var(--accent) 8%, transparent);
    color: var(--accent);
    max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .link-button:hover { background: color-mix(in srgb, var(--accent) 16%, transparent); }
  .link-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* Secondary to a served-page link: it acts on this laptop, not on a devbox. */
  .link-button.muted {
    border-color: var(--hairline);
    background: transparent;
    color: var(--ink-muted);
  }
  .link-button.muted:hover { background: color-mix(in srgb, var(--ink-muted) 10%, transparent); }
  .link-button.muted:focus-visible { outline-color: var(--ink-muted); }
  .link-button.muted[data-note="true"] { color: var(--serious); border-color: color-mix(in srgb, var(--serious) 40%, var(--hairline)); }

  /* ---- iframe viewer --------------------------------------------------- */
  .viewer {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; background: var(--plane);
  }
  .viewer[hidden] { display: none; }
  .viewer-head {
    display: flex; align-items: center; gap: 16px;
    padding: 8px 14px; background: var(--surface);
    border-bottom: 1px solid var(--rule); flex: none;
  }
  .viewer-tabs {
    display: flex; gap: 6px; overflow-x: auto; flex: 1 1 auto;
    scrollbar-width: thin;
  }
  .viewer-tab {
    display: flex; align-items: baseline; gap: 7px;
    font: inherit; font-size: 13px; line-height: 1.3;
    padding: 6px 12px; border-radius: 8px; cursor: pointer; white-space: nowrap;
    border: 1px solid transparent; background: transparent; color: var(--ink-2);
  }
  .viewer-tab:hover { background: var(--surface-sunken); color: var(--ink); }
  .viewer-tab[aria-selected="true"] {
    background: var(--surface-sunken); color: var(--ink);
    border-color: var(--hairline); font-weight: 560;
  }
  .viewer-tab .tab-sub { font-size: 11.5px; color: var(--ink-muted); font-weight: 400; }
  .viewer-tab .tab-key {
    font-size: 10.5px; color: var(--ink-muted);
    font-variant-numeric: tabular-nums; border: 1px solid var(--rule);
    border-radius: 4px; padding: 0 4px;
  }
  .viewer-tab[data-ended="true"] { opacity: 0.55; text-decoration: line-through; }
  .viewer-actions { display: flex; align-items: center; gap: 12px; flex: none; }
  .viewer-body { flex: 1 1 auto; position: relative; background: var(--surface); }
  .viewer-body iframe {
    position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
  }
  .viewer-body iframe[hidden] { display: none; }
  .viewer-empty {
    display: grid; place-items: center; height: 100%;
    color: var(--ink-muted); font-size: 14px; text-align: center; padding: 24px;
  }

  @media (max-width: 560px) {
    .run { grid-template-columns: minmax(0, 1fr) auto 20px; }
    .run-state { grid-column: 1; }
    .run-main { grid-column: 1 / -1; grid-row: 2; }
    .run-age { grid-column: 2; grid-row: 1; }
    .run-dismiss { grid-column: 3; grid-row: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>llm-watch <span id="host-count"></span></h1>
    <div class="meta">
      <button class="link" id="toggle-stopped" type="button" aria-pressed="false">Show stopped</button>
      <button class="link" id="toggle-theme" type="button">Theme</button>
      <span class="conn" id="conn" data-live="false">connecting…</span>
      <button class="icon-button" id="toggle-wake" type="button" aria-pressed="false"
              aria-label="Keep the screen awake" title="Keep the screen awake">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 4a5.5 5.5 0 0 0-3.2 9.98c.5.36.9 1 .9 1.7v.32h4.6v-.32c0-.7.4-1.34.9-1.7A5.5 5.5 0 0 0 12 4Z"/>
          <path d="M9.7 18.4h4.6M10.7 21h2.6"/>
          <g class="rays">
            <path d="M12 .9v1.5M3.9 4.6l1.1 1.1M20.1 4.6l-1.1 1.1M1 12.7h1.5M21.5 12.7H23"/>
          </g>
        </svg>
      </button>
    </div>
  </header>

  <section class="tiles" id="tiles" aria-label="Summary"></section>
  <main class="hosts" id="hosts"></main>
  <footer id="footer"></footer>
</div>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="Served pages">
  <div class="viewer-head">
    <div class="viewer-tabs" id="viewer-tabs" role="tablist"></div>
    <div class="viewer-actions">
      <a class="link" id="viewer-open" href="#" target="_blank" rel="noopener">Open in new tab ↗</a>
      <button class="link" id="viewer-close" type="button">Close ✕</button>
    </div>
  </div>
  <div class="viewer-body" id="viewer-body"></div>
</div>

<script>
(() => {
  "use strict";

  // Glyphs pair with the text label so state is never carried by color alone.
  // WORKING ranks first everywhere: it is the signal the dashboard exists for.
  const STATES = {
    running:     { label: "Working",     glyph: "◐", rank: 0 },
    approval:    { label: "Approval",    glyph: "!", rank: 1 },
    error:       { label: "Error",       glyph: "✕", rank: 2 },
    ready:       { label: "Ready",       glyph: "✓", rank: 3 },
    idle:        { label: "Idle",        glyph: "◦", rank: 4 },
    stopped:     { label: "Stopped",     glyph: "○", rank: 5 },
    unreachable: { label: "Unreachable", glyph: "⚠", rank: 6 },
  };
  // READY is deliberately absent from the headline tiles and from the per-host
  // counts: a box is either working or it is not. Ready rows still render, so a
  // finished session keeps its last message on screen for context.
  const COUNTED = ["running", "approval", "error"];
  // Only settled rows can be waved away. A box that is working, waiting on you,
  // or broken is the whole point of the dashboard and stays put.
  const DISMISSIBLE = new Set(["ready", "idle"]);

  const el = {
    conn: document.getElementById("conn"),
    tiles: document.getElementById("tiles"),
    hosts: document.getElementById("hosts"),
    footer: document.getElementById("footer"),
    hostCount: document.getElementById("host-count"),
    toggleStopped: document.getElementById("toggle-stopped"),
    toggleTheme: document.getElementById("toggle-theme"),
    toggleWake: document.getElementById("toggle-wake"),
    viewer: document.getElementById("viewer"),
    viewerTabs: document.getElementById("viewer-tabs"),
    viewerBody: document.getElementById("viewer-body"),
    viewerOpen: document.getElementById("viewer-open"),
    viewerClose: document.getElementById("viewer-close"),
  };

  let state = null;
  let receivedAt = null;
  // The one chip being edited, as `{ host, field }` — a label or a PR link.
  let editing = null;
  let showStopped = localStorage.getItem("llm-watch.stopped") === "true";

  const isEditing = (host, field) =>
    editing !== null && editing.host === host && editing.field === field;

  /* ---- dismissed rows ------------------------------------------------ */

  // Dismissing a row records the run exactly as it stood; the row comes back the
  // moment that stamp no longer matches, which is to say on its next event. The
  // map survives a reload, because a page left up on a second screen reloads for
  // reasons that have nothing to do with wanting those rows back.
  const DISMISS_KEY = "llm-watch.dismissed";
  const dismissed = new Map(readDismissed());

  function readDismissed() {
    try {
      const stored = JSON.parse(localStorage.getItem(DISMISS_KEY) || "[]");
      if (!Array.isArray(stored)) return [];
      return stored.filter((entry) =>
        Array.isArray(entry) && entry.length === 2 &&
        typeof entry[0] === "string" && typeof entry[1] === "string");
    } catch {
      return [];
    }
  }

  function writeDismissed() {
    try {
      localStorage.setItem(DISMISS_KEY, JSON.stringify([...dismissed]));
    } catch {
      // A full or blocked store only costs the dismissals their persistence.
    }
  }

  const runKey = (host, run) => host + "|" + (run.run_id || run.session_id || run.tmux || "");
  // State rides along with the timestamp so a row also returns if a snapshot
  // reports a new state without moving the clock.
  const runStamp = (run) => run.state + "@" + run.updated_at;

  const isDismissed = (host, run) => dismissed.get(runKey(host, run)) === runStamp(run);

  function dismissRun(host, run) {
    dismissed.set(runKey(host, run), runStamp(run));
    writeDismissed();
    render(true);
  }

  function restoreHost(host) {
    for (const run of host.runs) dismissed.delete(runKey(host.host, run));
    writeDismissed();
    render(true);
  }

  // Runs disappear for good when a session is reaped, so drop their entries
  // rather than letting the store grow for the life of the browser profile.
  function pruneDismissed() {
    if (!state || !dismissed.size) return;
    const alive = new Set();
    for (const host of state.hosts) {
      for (const run of host.runs) alive.add(runKey(host.host, run));
    }
    let dropped = false;
    for (const key of [...dismissed.keys()]) {
      if (!alive.has(key)) {
        dismissed.delete(key);
        dropped = true;
      }
    }
    if (dropped) writeDismissed();
  }

  // The server persists to the labels config and re-broadcasts, so the new
  // label arrives back over the event stream like any other change.
  function saveLabel(host, label) {
    fetch("/api/label", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ host, label }),
    }).catch(() => {});
  }

  // Attaches or detaches a PR the same way. A rejection carries a short
  // sentence — "not a GitHub PR link" — which is what the card shows.
  function savePr(host, url, action) {
    fetch("/api/pr", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ host, url, action }),
    })
      .then((response) => (response.ok ? null : response.text().catch(() => "")))
      .catch(() => "could not reach llm-watch")
      .then((note) => {
        if (note === null) return;
        prNote.set(host, { text: note.trim() || "could not save PR", until: Date.now() + 5000 });
        render(true);
        // A poll may not land before the note expires, so clear it ourselves.
        setTimeout(() => render(), 5100);
      });
  }

  // Focus outcomes are not part of the broadcast state, and every push rebuilds
  // the cards — so a message written onto the button would be wiped within a
  // second. Park it here instead, keyed by host, and let renderHost read it back.
  const focusNote = new Map();
  // Same idea for a refused PR link, shown beside that card's chips.
  const prNote = new Map();
  const FOCUS_NOTES = {
    no_tab: "no WezTerm tab",
    not_running: "WezTerm not running",
    not_installed: "wezterm not found",
  };

  function focusHost(host) {
    fetch("/api/focus", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ host }),
    })
      .then((response) => (response.ok ? response.json() : { status: "failed" }))
      .catch(() => ({ status: "failed" }))
      .then((result) => {
        const note = result.status === "activated" ? null : FOCUS_NOTES[result.status] || "failed";
        if (note) focusNote.set(host, { text: note, until: Date.now() + 4000 });
        render(true);
        // A poll may not land before the note expires, so clear it ourselves.
        if (note) setTimeout(() => render(), 4100);
      });
  }

  /* ---- helpers ------------------------------------------------------ */

  const meta = (name) => STATES[name] || { label: name || "Unknown", glyph: "?", rank: 9 };

  function ago(iso) {
    if (!iso) return null;
    const then = Date.parse(iso);
    if (Number.isNaN(then)) return null;
    return Math.max(0, Math.round((Date.now() - then) / 1000));
  }

  function duration(seconds) {
    if (seconds === null) return "–";
    if (seconds < 60) return seconds + "s";
    if (seconds < 3600) return Math.floor(seconds / 60) + "m";
    if (seconds < 86400) return Math.floor(seconds / 3600) + "h";
    return Math.floor(seconds / 86400) + "d";
  }

  function badge(name) {
    const node = document.createElement("span");
    node.className = "badge";
    node.dataset.state = name;
    node.setAttribute("aria-hidden", "true");
    node.textContent = meta(name).glyph;
    return node;
  }

  function pill(name, className) {
    const node = document.createElement("span");
    node.className = className;
    node.dataset.state = name;
    node.append(badge(name), meta(name).label);
    return node;
  }

  function text(tag, className, value) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (value !== undefined) node.textContent = value;
    return node;
  }

  /* ---- render ------------------------------------------------------- */

  function visibleRuns(host) {
    return host.runs
      .filter((run) => (showStopped || run.state !== "stopped") && !isDismissed(host.host, run))
      .sort((a, b) => meta(a.state).rank - meta(b.state).rank ||
        String(b.updated_at).localeCompare(String(a.updated_at)));
  }

  const isWorking = (host) => host.runs.some((run) => run.state === "running");

  function tile(name, heading, value, zero) {
    const node = text("div", "tile");
    node.dataset.zero = String(zero);
    const label = text("div", "label");
    label.append(badge(name), heading);
    node.append(label, text("div", "value", value));
    return node;
  }

  function renderTiles() {
    const totals = Object.create(null);
    let unreachable = 0;
    let working = 0;
    for (const host of state.hosts) {
      if (!host.reachable) unreachable += 1;
      if (isWorking(host)) working += 1;
      for (const run of host.runs) totals[run.state] = (totals[run.state] || 0) + 1;
    }

    // The headline is devbox-centric: how many boxes are actually working.
    el.tiles.replaceChildren(
      tile("running", "Working", working + " / " + state.hosts.length, working === 0),
      tile("approval", "Approval", String(totals.approval || 0), !totals.approval),
      tile("error", "Error", String(totals.error || 0), !totals.error),
      tile("unreachable", "Unreachable", unreachable + " / " + state.hosts.length, unreachable === 0),
    );
  }

  function dismissNode(host, run) {
    const slot = text("div", "run-dismiss");
    if (!DISMISSIBLE.has(run.state)) return slot;
    const button = text("button", "run-drop", "×");
    button.type = "button";
    const what = run.task || run.project || "this session";
    button.title = "Hide until this session updates";
    button.setAttribute("aria-label", "Hide " + what + " on " + host + " until it updates");
    button.addEventListener("click", () => dismissRun(host, run));
    slot.append(button);
    return slot;
  }

  function renderRun(host, run) {
    const row = text("div", "run");
    row.dataset.state = run.state;
    row.append(pill(run.state, "pill run-state"));

    const main = text("div", "run-main");
    const task = text("div", "run-task", run.task || "No task recorded");
    if (!run.task) task.classList.add("empty");
    else task.title = run.task;
    main.append(task);

    const sub = text("div", "run-sub");
    if (run.provider) sub.append(text("span", "tag", run.provider));
    const facts = [run.project, run.tmux ? "tmux:" + run.tmux : "", run.cwd].filter(Boolean);
    facts.forEach((fact, index) => {
      if (index > 0) sub.append(text("span", "sep", "·"));
      sub.append(text("span", null, fact));
    });
    main.append(sub);

    // The agent's last word — the context you want when a box goes ready.
    if (run.message) {
      const message = text("div", "run-message", run.message);
      message.title = run.message;
      main.append(message);
    }
    row.append(main);

    const age = ago(run.updated_at);
    const stamp = text("div", "run-age", duration(age));
    if (run.updated_at) stamp.title = "Last event " + run.updated_at;
    row.append(stamp, dismissNode(host, run));
    return row;
  }

  function labelNode(host) {
    if (isEditing(host.host, "label")) {
      const input = document.createElement("input");
      input.className = "label-input";
      input.value = host.label || "";
      input.placeholder = "work stream";
      input.maxLength = 60;
      input.setAttribute("aria-label", "Work stream for " + host.host);
      let settled = false;
      const finish = (save) => {
        if (settled) return;
        settled = true;
        editing = null;
        if (save && input.value.trim() !== (host.label || "")) {
          saveLabel(host.host, input.value.trim());
        }
        render(true);
      };
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") finish(true);
        else if (event.key === "Escape") finish(false);
      });
      input.addEventListener("blur", () => finish(true));
      return input;
    }
    const button = text("button", "label-chip");
    button.type = "button";
    button.dataset.empty = String(!host.label);
    button.textContent = host.label || "+ label";
    button.title = "Set the work stream for " + host.host;
    button.addEventListener("click", () => {
      editing = { host: host.host, field: "label" };
      render(true);
    });
    return button;
  }

  // A PR you are working on, kept beside the label so a card says what the box
  // is doing and where the review of it lives.
  function prChip(host, pr) {
    const chip = text("span", "pr-chip");
    const link = document.createElement("a");
    link.href = pr.url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.title = pr.owner + "/" + pr.repo + " #" + pr.number + " · " + pr.url;
    link.append(text("span", "pr-repo", pr.repo + " "), text("span", null, "#" + pr.number));

    const drop = text("button", "pr-drop", "×");
    drop.type = "button";
    drop.title = "Detach this PR from " + host;
    drop.setAttribute("aria-label", "Detach " + pr.repo + " #" + pr.number + " from " + host);
    drop.addEventListener("click", () => savePr(host, pr.url, "remove"));

    chip.append(link, drop);
    return chip;
  }

  function prAddNode(host) {
    if (isEditing(host.host, "pr")) {
      const input = document.createElement("input");
      input.className = "label-input wide";
      input.placeholder = "GitHub PR link or owner/repo#123";
      input.maxLength = 300;
      input.setAttribute("aria-label", "Attach a GitHub pull request to " + host.host);
      let settled = false;
      const finish = (save) => {
        if (settled) return;
        settled = true;
        editing = null;
        const url = input.value.trim();
        if (save && url) savePr(host.host, url, "add");
        render(true);
      };
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") finish(true);
        else if (event.key === "Escape") finish(false);
      });
      input.addEventListener("blur", () => finish(true));
      return input;
    }
    const button = text("button", "label-chip", "+ PR");
    button.type = "button";
    button.dataset.empty = "true";
    button.title = "Attach a GitHub pull request to " + host.host;
    button.addEventListener("click", () => {
      editing = { host: host.host, field: "pr" };
      render(true);
    });
    return button;
  }

  function prNodes(host) {
    const nodes = (host.prs || []).map((pr) => prChip(host.host, pr));
    nodes.push(prAddNode(host));
    const note = prNote.get(host.host);
    if (note && note.until <= Date.now()) prNote.delete(host.host);
    else if (note) nodes.push(text("span", "host-note warn", note.text));
    return nodes;
  }

  // Raises the local WezTerm on this devbox's tab. The tab is matched by title,
  // so this only finds tabs opened by the wezterm.lua startup handler.
  function wezterm(host) {
    const note = focusNote.get(host);
    if (note && note.until <= Date.now()) focusNote.delete(host);
    const fresh = focusNote.get(host);
    const button = text("button", "link-button muted");
    button.type = "button";
    button.dataset.note = String(Boolean(fresh));
    button.textContent = fresh ? fresh.text : "WezTerm ↗";
    button.title = fresh ? fresh.text : "Jump to the WezTerm tab for " + host;
    button.addEventListener("click", () => focusHost(host));
    return button;
  }

  function renderHost(host) {
    const card = text("section", "host");
    card.dataset.reachable = String(host.reachable);
    const working = isWorking(host);
    card.dataset.working = String(working);

    const head = text("div", "host-head");
    head.append(pill(working ? "running" : "idle", "pill host-verdict"));
    head.append(text("span", "host-name", host.host));
    head.append(labelNode(host));
    head.append(...prNodes(host));

    const runs = visibleRuns(host);
    const counts = text("div", "counts");
    for (const name of COUNTED) {
      const n = host.runs.filter((run) => run.state === name).length;
      if (!n) continue;
      const count = text("span", "count");
      count.append(badge(name), n + " " + meta(name).label.toLowerCase());
      counts.append(count);
    }
    // Dismissing is meant to be cheap, which it only is if it is reversible
    // without waiting on the box to say something.
    const hushed = host.runs.filter((run) => isDismissed(host.host, run)).length;
    if (hushed) {
      const restore = text("button", "count-restore", hushed + " dismissed");
      restore.type = "button";
      restore.title = "Show the dismissed sessions on " + host.host + " again";
      restore.addEventListener("click", () => restoreHost(host));
      counts.append(restore);
    }
    for (const link of host.links || []) {
      if (!/^https?:\/\//i.test(link.url)) continue;
      const button = text("button", "link-button");
      button.type = "button";
      button.textContent = link.kind + (link.title ? " · " + link.title : "");
      button.title = link.url;
      button.addEventListener("click", () => openViewer(link.url));
      head.append(button);
    }
    head.append(wezterm(host.host));

    head.append(counts, text("div", "spacer"));

    if (host.reachable) {
      head.append(text("span", "host-note", "polled " + duration(ago(state.generated_at)) + " ago"));
    } else if (host.stale) {
      const note = text("span", "host-note warn",
        "offline · last seen " + duration(ago(host.observed_at)) + " ago");
      head.append(note);
    } else {
      head.append(text("span", "host-note warn", "never reached"));
    }
    card.append(head);

    if (!host.reachable && host.error) {
      const row = text("div", "error-row");
      row.append(badge("unreachable"), " ");
      row.append(text("code", null, host.error));
      card.append(row);
    }

    if (runs.length === 0) {
      const stopped = showStopped
        ? 0
        : host.runs.filter((run) => run.state === "stopped").length;
      const hidden = [
        stopped ? stopped + " stopped" : "",
        hushed ? hushed + " dismissed" : "",
      ].filter(Boolean);
      card.append(text("div", "empty-row", hidden.length
        ? "No active sessions · " + hidden.join(", ") + " hidden"
        : host.reachable || host.stale ? "No sessions recorded" : "No data yet"));
    } else {
      runs.forEach((run) => card.append(renderRun(host.host, run)));
    }
    return card;
  }

  // Repainting mid-edit would destroy the focused input, so background renders
  // are held until the edit settles; `force` is the render that started it.
  function render(force) {
    if (!state || (editing !== null && !force)) return;
    el.hostCount.textContent = state.hosts.length +
      (state.hosts.length === 1 ? " devbox" : " devboxes");
    renderTiles();
    el.hosts.replaceChildren(...state.hosts.map(renderHost));
    const input = el.hosts.querySelector(".label-input");
    if (input) {
      input.focus();
      input.select();
    }
    renderViewer();
    const seen = ago(state.generated_at);
    el.footer.textContent = "Snapshot " + state.generated_at +
      " · polling every " + state.interval_seconds + "s" +
      (seen !== null ? " · " + duration(seen) + " old" : "");
  }

  function setConnected(live) {
    el.conn.dataset.live = String(live);
    if (!live) {
      el.conn.textContent = "reconnecting…";
    } else {
      const seen = receivedAt === null ? null : Math.max(0, Math.round((Date.now() - receivedAt) / 1000));
      el.conn.textContent = seen === null ? "live" : "live · updated " + duration(seen) + " ago";
    }
  }

  /* ---- served-page viewer ---------------------------------------------- */

  // Iframes are created once and kept alive behind `hidden`, so tabbing back to
  // a page does not reload it or lose your scroll position.
  const viewer = { open: false, active: null, frames: new Map() };

  function allLinks() {
    const links = [];
    for (const host of state ? state.hosts : []) {
      for (const link of host.links || []) {
        if (!/^https?:\/\//i.test(link.url)) continue;
        links.push({ host: host.host, hostLabel: host.label, ...link });
      }
    }
    return links;
  }

  function openViewer(url) {
    viewer.open = true;
    viewer.active = url;
    el.viewer.hidden = false;
    renderViewer();
  }

  function closeViewer() {
    viewer.open = false;
    el.viewer.hidden = true;
  }

  function frameFor(url) {
    let frame = viewer.frames.get(url);
    if (!frame) {
      frame = document.createElement("iframe");
      frame.src = url;
      frame.title = url;
      frame.referrerPolicy = "no-referrer";
      viewer.frames.set(url, frame);
      el.viewerBody.append(frame);
    }
    return frame;
  }

  function renderViewer() {
    if (!viewer.open) return;
    const links = allLinks();
    // A page you are reading stays tabbable even after its tunnel goes away.
    const known = links.map((link) => link.url);
    if (viewer.active && !known.includes(viewer.active)) {
      const previous = viewer.frames.get(viewer.active);
      if (previous) {
        links.push({
          host: previous.dataset.host || "gone",
          title: previous.dataset.title || "",
          url: viewer.active,
          ended: true,
        });
      }
    }
    if (!links.length) {
      viewer.active = null;
      el.viewerTabs.replaceChildren();
      el.viewerBody.replaceChildren(
        text("div", "viewer-empty", "No devbox is serving a page right now."));
      viewer.frames.clear();
      el.viewerOpen.removeAttribute("href");
      return;
    }
    if (!viewer.active || !links.some((link) => link.url === viewer.active)) {
      viewer.active = links[0].url;
    }

    el.viewerTabs.replaceChildren(...links.map((link, index) => {
      const tab = text("button", "viewer-tab");
      tab.type = "button";
      tab.setAttribute("role", "tab");
      tab.setAttribute("aria-selected", String(link.url === viewer.active));
      if (link.ended) tab.dataset.ended = "true";
      tab.append(text("span", null, link.hostLabel || link.host));
      if (link.title) tab.append(text("span", "tab-sub", link.title));
      if (index < 9) tab.append(text("span", "tab-key", String(index + 1)));
      tab.title = link.host + " · " + link.url;
      tab.addEventListener("click", () => {
        viewer.active = link.url;
        renderViewer();
      });
      return tab;
    }));

    const empty = el.viewerBody.querySelector(".viewer-empty");
    if (empty) empty.remove();
    for (const link of links) {
      const frame = frameFor(link.url);
      frame.dataset.host = link.host;
      frame.dataset.title = link.title || "";
      frame.hidden = link.url !== viewer.active;
    }
    el.viewerOpen.href = viewer.active;
  }

  el.viewerClose.addEventListener("click", closeViewer);
  document.addEventListener("keydown", (event) => {
    if (!viewer.open) return;
    if (event.key === "Escape") {
      closeViewer();
      return;
    }
    const tabs = [...el.viewerTabs.children];
    const current = tabs.findIndex((tab) => tab.getAttribute("aria-selected") === "true");
    if (event.key === "ArrowRight" || event.key === "ArrowLeft") {
      if (tabs.length < 2) return;
      event.preventDefault();
      const step = event.key === "ArrowRight" ? 1 : -1;
      tabs[(current + step + tabs.length) % tabs.length].click();
    } else if (/^[1-9]$/.test(event.key) && tabs[Number(event.key) - 1]) {
      event.preventDefault();
      tabs[Number(event.key) - 1].click();
    }
  });

  /* ---- live updates -------------------------------------------------- */

  // EventSource reconnects on its own; onerror only drives the status text.
  const source = new EventSource("/api/stream");
  source.onmessage = (event) => {
    try {
      state = JSON.parse(event.data);
    } catch {
      return;
    }
    receivedAt = Date.now();
    pruneDismissed();
    setConnected(true);
    render();
  };
  source.onopen = () => setConnected(true);
  source.onerror = () => setConnected(false);

  // Ages are computed client-side, so tick them independently of the feed.
  setInterval(() => {
    if (!state) return;
    setConnected(el.conn.dataset.live === "true");
    render();
  }, 1000);

  /* ---- controls -------------------------------------------------------- */

  function applyStoppedLabel() {
    el.toggleStopped.textContent = showStopped ? "Hide stopped" : "Show stopped";
    el.toggleStopped.setAttribute("aria-pressed", String(showStopped));
  }
  el.toggleStopped.addEventListener("click", () => {
    showStopped = !showStopped;
    localStorage.setItem("llm-watch.stopped", String(showStopped));
    applyStoppedLabel();
    render();
  });
  applyStoppedLabel();

  const storedTheme = localStorage.getItem("llm-watch.theme");
  if (storedTheme) document.documentElement.dataset.theme = storedTheme;
  el.toggleTheme.addEventListener("click", () => {
    const dark = matchMedia("(prefers-color-scheme: dark)").matches;
    const current = document.documentElement.dataset.theme;
    const resolved = current === "light" || current === "dark" ? current : (dark ? "dark" : "light");
    const next = resolved === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    localStorage.setItem("llm-watch.theme", next);
  });

  /* ---- screen wake lock -------------------------------------------------- */

  // The dashboard is meant to be left up on a second screen, so the lightbulb
  // holds a screen wake lock and the laptop stays awake to show it. Browsers
  // drop the lock whenever the tab is hidden, hence the visibilitychange retake.
  // The API is secure-context only: over plain http to a LAN address it is
  // absent, and the button says so rather than silently doing nothing.
  // Deliberately not remembered across loads: holding a laptop awake is a
  // decision about right now, and a reload should not silently re-take it.
  const wake = { want: false, lock: null };
  localStorage.removeItem("llm-watch.wake");

  function paintWake(note) {
    el.toggleWake.setAttribute("aria-pressed", String(wake.want));
    const title = note || (wake.want ? "Screen stays awake — click to release" : "Keep the screen awake");
    el.toggleWake.title = title;
    el.toggleWake.setAttribute("aria-label", title);
  }

  async function acquireWake() {
    if (wake.lock !== null || document.visibilityState !== "visible") return;
    try {
      wake.lock = await navigator.wakeLock.request("screen");
      wake.lock.addEventListener("release", () => { wake.lock = null; });
      paintWake();
    } catch {
      // Refused — a hidden tab, or a battery saver. Drop the intent rather than
      // leaving the bulb lit over a lock we do not hold.
      wake.want = false;
      paintWake("could not keep the screen awake");
    }
  }

  function releaseWake() {
    const lock = wake.lock;
    wake.lock = null;
    if (lock) lock.release().catch(() => {});
  }

  if (!("wakeLock" in navigator)) {
    wake.want = false;
    el.toggleWake.disabled = true;
    paintWake("screen wake lock needs https or localhost");
  } else {
    el.toggleWake.addEventListener("click", () => {
      wake.want = !wake.want;
      paintWake();
      if (wake.want) acquireWake();
      else releaseWake();
    });
    // Within a single load the intent outlives the lock, which browsers drop
    // whenever the tab goes away — so coming back re-takes it.
    document.addEventListener("visibilitychange", () => {
      if (wake.want) acquireWake();
    });
    paintWake();
  }
})();
</script>
</body>
</html>
